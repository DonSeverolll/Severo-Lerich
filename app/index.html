<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#0c0a09" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <title>Severo</title>
    <script>
      // Aplica o tema salvo antes do primeiro quadro (evita piscar).
      try {
        var pref = (JSON.parse(localStorage.getItem('severo-app') || '{}').state || {}).settings?.theme || 'system';
        var dark = pref === 'dark' || (pref === 'system' && !matchMedia('(prefers-color-scheme: light)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
