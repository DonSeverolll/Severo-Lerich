name: App (Windows + Android)

# - push em main (mudanças em app/): compila e anexa os instaláveis como artefatos do run.
# - tag v*: compila e publica uma Release com o .exe/.msi do Windows e o .apk do Android.
on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/app.yml']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows (.exe / .msi)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
      - run: npm ci
      - run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: severo-windows
          path: |
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  android:
    name: Android (.apk)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      NDK_VERSION: 27.2.12479018
      BUILD_TOOLS: 35.0.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: SDK, build-tools e NDK
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;${BUILD_TOOLS}" "ndk;${NDK_VERSION}" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
      - run: npm ci
      - name: Gerar projeto Android
        run: |
          npx tauri android init --ci
          npx tauri icon app-icon.svg
          # Microfone para o orbe de voz.
          MANIFEST=src-tauri/gen/android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <application#' "$MANIFEST"
          grep -n "uses-permission" "$MANIFEST"
      - name: Compilar APK
        run: npx tauri android build --apk --target aarch64 --target armv7 --ci
      - name: Assinar APK
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          BT="$ANDROID_HOME/build-tools/${BUILD_TOOLS}"
          UNSIGNED=$(find src-tauri/gen/android/app/build/outputs/apk -name '*-unsigned.apk' | head -1)
          echo "APK: $UNSIGNED"
          if [ -n "$ANDROID_KEYSTORE_B64" ]; then
            echo "$ANDROID_KEYSTORE_B64" | base64 -d > release.keystore
            PASS="$ANDROID_KEYSTORE_PASSWORD"; ALIAS="$ANDROID_KEY_ALIAS"
          else
            echo "::warning::Sem secrets de assinatura: usando uma chave temporária. Atualizar o app exigirá desinstalar a versão anterior."
            keytool -genkeypair -keystore release.keystore -alias severo -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass severo-temp -keypass severo-temp -dname "CN=Severo, O=Severo, C=BR"
            PASS=severo-temp; ALIAS=severo
          fi
          VERSION=$(node -p "require('./package.json').version")
          "$BT/zipalign" -p -f 4 "$UNSIGNED" aligned.apk
          "$BT/apksigner" sign --ks release.keystore --ks-pass "pass:$PASS" --ks-key-alias "$ALIAS" --out "Severo_${VERSION}_android.apk" aligned.apk
          "$BT/apksigner" verify "Severo_${VERSION}_android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: severo-android
          path: app/Severo_*_android.apk
          if-no-files-found: error

  release:
    name: Publicar Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: Severo ${{ github.ref_name }}
          files: dist/**/*
          body: |
            ## Downloads
            - **Windows**: `Severo_*_x64-setup.exe` (recomendado) ou `.msi`
            - **Android**: `Severo_*_android.apk` — permita "instalar apps de fontes desconhecidas"

            Depois de instalar, abra **Configurações** e informe ao menos uma chave de API (Groq, Cerebras, Gemini, Mistral ou OpenRouter — todas gratuitas).
